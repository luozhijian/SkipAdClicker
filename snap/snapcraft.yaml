name: skipadclicker
title: SkipAdClicker
version: "0.1.5"
summary: Desktop automation tool for finding and clicking Skip Ad controls
description: |
  SkipAdClicker is a lightweight C++ Windows desktop application that automatically detects and clicks the "Skip Ad" button during video playback. It uses approximately 2–3% CPU while a supported web browser is running and about 0.7% CPU when no browser is active.
  The application works by capturing screenshots of the screen and analyzing them with OpenCV. When the "Skip Ad" button is detected, SkipAdClicker automatically moves the mouse cursor and clicks the button.
  SkipAdClicker features a simple Windows Forms interface that allows you to start or stop the clicker with a single click. When minimized, it runs quietly in the Windows system tray to stay out of the way. To completely close the application, select Close or Exit from the menu.
  The application also uses different tray icons to indicate its current status, making it easy to see whether the clicker is running or stopped. If you want SkipAdClicker to start automatically whenever Windows starts, you can enable the Start with Windows option in the application settings.
base: core24
grade: stable
confinement: strict
license: MIT

website: https://github.com/luozhijian/SkipAdClicker
 
platforms:
  amd64:

apps:
  skipadclicker:
    command: usr/bin/skipadclicker
    autostart: skipadclicker.desktop
    extensions:
      - kde-neon-6
    plugs:
      - home
      - removable-media
    environment:
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/5/tessdata
      SESSION_MANAGER: ""

parts:
  skipadclicker:
    plugin: nil
    source: .
    source-type: local
    # Add or change the line directly below this comment:
    build-packages:
      - build-essential
      - cmake
      - ninja-build
      - pkg-config
      - libopencv-dev
      - libtesseract-dev
      - libleptonica-dev
      - libx11-dev
      - libxtst-dev
    stage-packages:
      - libopencv-dev
      - libtesseract5
      - liblept5
      - tesseract-ocr-eng
      - libx11-6
      - libxtst6
      - libcanberra-gtk-module
      - libcanberra-gtk3-module
    override-build: |
      cmake -S "$CRAFT_PART_SRC" -B "$CRAFT_PART_BUILD/build" -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DAUTOMATIOTEST_BUILD_QT_APP=ON
      cmake --build "$CRAFT_PART_BUILD/build" --target SkipAdClicker --parallel "$CRAFT_PARALLEL_BUILD_COUNT"

      install -Dm755 "$CRAFT_PART_BUILD/build/bin/skipadclicker" "$CRAFT_PART_INSTALL/usr/bin/skipadclicker"
      cp -a "$CRAFT_PART_BUILD/build/bin/SkipAd" "$CRAFT_PART_INSTALL/usr/bin/SkipAd"
      cp -a "$CRAFT_PART_BUILD/build/bin/tessdata" "$CRAFT_PART_INSTALL/usr/bin/tessdata"
      install -Dm644 "$CRAFT_PART_BUILD/build/bin/SkipAdClicker.ini" "$CRAFT_PART_INSTALL/usr/bin/SkipAdClicker.ini"
      install -Dm644 "$CRAFT_PART_BUILD/build/bin/SkipAdClicker.ico" "$CRAFT_PART_INSTALL/usr/bin/SkipAdClicker.ico"
      install -Dm644 "$CRAFT_PART_BUILD/build/bin/SkipAdClicker_ON.ico" "$CRAFT_PART_INSTALL/usr/bin/SkipAdClicker_ON.ico"
      install -Dm644 "$CRAFT_PART_BUILD/build/bin/BrowserApplications.ini" "$CRAFT_PART_INSTALL/usr/bin/BrowserApplications.ini"
    prime:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/lib/*/pkgconfig
      - -usr/share/doc
      - -usr/share/man
